# The server of one bundle agent (agent-tmux.py): no clipboard write and no passthrough from the
# container, and the bundle, the name of its session, on the status line for whoever attaches.
# No prefix key, so that Ctrl+B reaches claude; the wheel scrolls the history; Escape at once.
set -s set-clipboard off
set -s escape-time 10
set -s extended-keys on
set -g allow-passthrough off
set -g history-limit 10000
set -g mouse on
set -g prefix None
set -g status-left-length 80
set -g status-left "#{session_name} "
